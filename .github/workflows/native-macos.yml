name: Native arm64 macOS validation
on:
  push:
    branches:
      - implementation/native-foundation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check host architecture
        run: test "$(uname -m)" = arm64
      - name: Install build tools
        run: |
          brew install cmake expat
          python3 -m pip install unicorn==2.1.4
      - name: Build arm64 and run tests including synthetic native window
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix expat)"
          scripts/build-macos.sh
      - name: Package and smoke-test relocated development app
        run: |
          python3 scripts/package-macos.py build/macos-arm64/DredmorMac.app build/DredmorMac-arm64-development.zip
          build/macos-arm64/DredmorMac.app/Contents/MacOS/DredmorMac build/macos-arm64/native-combat/scene.json --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: DredmorMac-arm64-development-${{ github.run_number }}
          path: build/DredmorMac-arm64-development.zip
          retention-days: 14
