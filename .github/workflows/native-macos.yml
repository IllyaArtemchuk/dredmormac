name: Native arm64 macOS validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check host architecture
        run: test "$(uname -m)" = arm64
      - name: Install build tools
        run: brew install cmake expat
      - name: Build arm64 and run tests including synthetic native window
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix expat)"
          scripts/build-macos.sh
